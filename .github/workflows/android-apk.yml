name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate native Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: pnpm exec expo prebuild -p android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Assemble release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Expo's Gradle template signs release builds with a debug keystore, so
      # the APK installs as-is. Each run gets a fresh signature, so a new build
      # replaces rather than updates an existing install.
      - name: Collect APK
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          cp "$apk" "tennet-manager-${GITHUB_REF_NAME//\//-}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tennet-manager-apk
          path: tennet-manager-*.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tennet-manager-*.apk \
            --title "Tennet Manager ${GITHUB_REF_NAME#v}" \
            --generate-notes
